<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormDrill sample applications (fictional)</title>
<style>body{font:15px system-ui;max-width:760px;margin:0 auto;padding:16px}label{display:block;margin:10px 0 2px}input,textarea,select{width:100%;padding:6px}fieldset{margin:12px 0}form{border:1px solid #ccc;padding:12px;margin:20px 0}</style></head><body>
<h1>Sample forms (fictional test data only)</h1>
<form id="scholarship" onsubmit="event.preventDefault();alert('Demo only: nothing was sent.')"><h2>Brightfield Scholarship Application</h2>
<label for="s1">Applicant name</label><input id="s1" name="applicant_name" required>
<label for="s2">E-mail address</label><input id="s2" type="email" name="contact" required>
<label for="s3">College name</label><input id="s3" name="school">
<label for="s4">Country of residence</label><select id="s4" name="c"><option value="">Select</option><option>India</option><option>Canada</option><option>Kenya</option></select>
<fieldset><legend>Do you have documented financial need?</legend><label><input type="radio" name="need" value="yes"> Yes</label><label><input type="radio" name="need" value="no"> No</label></fieldset>
<label><input type="checkbox" name="agree"> I confirm my information is accurate</label>
<label for="s5">Why do you deserve this scholarship? (max 250 words)</label><textarea id="s5" name="essay1" rows="6" required></textarea>
<label for="s6">Where do you see yourself after graduation? Describe your future plans. (150 words)</label><textarea id="s6" rows="4"></textarea>
<button>Submit</button></form>
<form id="club" onsubmit="event.preventDefault();alert('Demo only: nothing was sent.')"><h2>Pixel &amp; Code Society: Join our coding club</h2>
<label for="c1">Name</label><input id="c1" autocomplete="name">
<label for="c2">Why do you want to join our coding club? (100 words max)</label><textarea id="c2"></textarea>
<label for="c3">Pitch an event you would organise</label><textarea id="c3"></textarea>
<label for="c4">Tell us about a time you took initiative</label><textarea id="c4"></textarea><button>Apply</button></form>
<form id="internship" onsubmit="event.preventDefault();alert('Demo only: nothing was sent.')"><h2>Summer Internship: Software Engineering</h2>
<label for="i1">Legal name</label><input id="i1" required>
<label for="i2">University</label><input id="i2"><label for="i3">Expected graduation</label><input id="i3" placeholder="e.g. 2027">
<label for="i4">Phone</label><input id="i4" type="tel"><label for="i5">Portfolio URL</label><input id="i5" type="url">
<label for="i6">Relevant experience</label><textarea id="i6"></textarea>
<label for="i7">Password for applicant portal</label><input id="i7" type="password"><button>Submit application</button></form>
<form id="multistep" onsubmit="event.preventDefault();alert('Demo only: nothing was sent.')"><h2>Multi-step grant application</h2><p id="stepnote" aria-current="step">Step 1 of 2: Applicant</p>
<div id="step1"><label for="m1">Full name</label><input id="m1"><button type="button" onclick="step1.hidden=true;step2.hidden=false;stepnote.textContent='Step 2 of 2: Project'">Next</button></div>
<div id="step2" hidden><label for="m2">Project summary (50 words)</label><textarea id="m2"></textarea><button type="button" id="addref">Add a reference (dynamic field)</button><div id="refs"></div><button>Submit</button></div></form>
<script>let n=0;document.getElementById('addref').onclick=()=>{n++;const l=document.createElement('label');l.textContent='Reference '+n+' email';const i=document.createElement('input');i.type='email';i.name='ref'+n;l.append(i);refs.append(l)}</script>
</body></html>
